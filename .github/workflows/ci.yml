name: CI

on:
  push:
    branches:
      - master
      - 'integration/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build & Test Workspace Suites
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Dependencies & Static Analysis
        working-directory: playnite-mobile-companion
        run: |
          flutter pub get
          flutter analyze

      - name: Run Unified Test Suites
        shell: powershell
        run: |
          powershell -File scripts/test_all.ps1
