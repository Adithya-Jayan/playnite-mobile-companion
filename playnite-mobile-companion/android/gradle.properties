# Guardrail: Resource bounds locked to prevent host memory exhaustion during R8 release builds.
# Do not increase -Xmx beyond 2048m or enable unrestricted parallel workers.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
